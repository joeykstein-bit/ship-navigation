<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1822" />
    <title>Ship Navigation: Uncharted Waters</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <h1>Ship Navigation: Uncharted Waters</h1>
        </div>
        <div class="status-panel">
          <div class="status-cluster">
            <span class="status-dot"></span>
            <span id="voyage-status">Ready</span>
          </div>
          <div class="elapsed-readout"><span>Time elapsed</span><strong id="elapsed-time">0:00</strong></div>
        </div>
      </header>
      <section class="game-layout" aria-label="Navigation game">
        <div class="chart-frame">
          <canvas id="game-canvas" aria-label="Top-down ocean navigation map"></canvas>
          <div class="chart-label chart-label--north">N</div>
          <div class="chart-label chart-label--south">S</div>
          <div id="start-banner" class="start-banner">Use arrow keys (or the on-screen arrows) to navigate left and right. Press space bar or tap to begin.</div>
          <div id="event-banner" class="event-banner"></div>
          <div class="survived-readout"><span>Survived</span><strong id="distance">0 s</strong></div>
        </div>
      </section>
    </main>
    <button type="button" id="nav-left" class="nav-button nav-button--left" aria-label="Steer left">‹</button>
    <button type="button" id="nav-right" class="nav-button nav-button--right" aria-label="Steer right">›</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
